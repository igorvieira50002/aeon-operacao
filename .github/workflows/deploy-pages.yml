name: Deploy AEON dashboard
# Pages source is configured for GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/aeon-react/package-lock.json
      - name: Install dependencies
        working-directory: outputs/aeon-react
        run: npm ci --legacy-peer-deps
      - name: Build dashboard
        working-directory: outputs/aeon-react
        run: npm run build
      - name: Validate public operational data
        working-directory: outputs/aeon-react
        run: node -e "JSON.parse(require('fs').readFileSync('public/data/status.json')); JSON.parse(require('fs').readFileSync('public/data/history.json')); console.log('operational data valid')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/aeon-react/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
